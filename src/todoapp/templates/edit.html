{% extends "layout.html" %} {% block content %}

<div class="container">
    <div class="card">
        <div class="card-header">Let's edit your todo</div>

        <div class="card-body">
            <form id="editTodoForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        value="{{ todo.title }}"
                        minlength="3"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        class="form-control"
                        rows="3"
                        id="description"
                        name="description"
                        minlength="3"
                        maxlength="100"
                        required
                    >{{ todo.description }}</textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select class="form-control" id="priority" name="priority">
                        {% for value in range(1, 6) %}
                        <option value="{{ value }}" {% if todo.priority == value %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="complete"
                        name="complete"
                        {% if todo.complete %}checked{% endif %}
                    />
                    <label class="form-check-label" for="complete">Complete</label>
                </div>

                <button type="submit" class="btn btn-primary">Save todo</button>
                <a href="{{ url_for('todo_page') }}" class="btn btn-success">Back</a>
                <button type="button" id="deleteButton" class="btn btn-danger float-right">
                    Delete
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
