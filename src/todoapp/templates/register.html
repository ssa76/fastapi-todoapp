{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block content %}
    <div class="container">
        <div class="card">
            <div class="card-header">Register</div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                            />
                        </div>
                        <div class="form-group col-md-6">
                            <label for="username">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                autocomplete="username"
                                minlength="3"
                                required
                            />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="firstname">First Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="firstname"
                                name="firstname"
                                autocomplete="given-name"
                                required
                            />
                        </div>
                        <div class="form-group col-md-6">
                            <label for="lastname">Last Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="lastname"
                                name="lastname"
                                autocomplete="family-name"
                                required
                            />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="phone_number">Phone Number <small class="text-muted">(optional)</small></label>
                        <input
                            type="tel"
                            class="form-control"
                            id="phone_number"
                            name="phone_number"
                            autocomplete="tel"
                            maxlength="32"
                        />
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            />
                            <small class="form-text text-muted">At least 8 characters.</small>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="password2">Verify Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password2"
                                name="password2"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
            <div class="card-footer text-muted">
                <a href="{{ url_for('login_page') }}">Already have an account?</a>
            </div>
        </div>
    </div>
{% endblock %}
