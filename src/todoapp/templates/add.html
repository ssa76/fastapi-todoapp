{% extends "layout.html" %}

{% block title %}New todo{% endblock %}

{% block content %}

<div class="container">
    <div class="card">
        <div class="card-header">Make a new todo</div>

        <div class="card-body">
            <form id="todoForm">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        minlength="3"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        class="form-control"
                        rows="3"
                        id="description"
                        name="description"
                        minlength="3"
                        maxlength="100"
                        required
                    ></textarea>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select class="form-control" id="priority" name="priority">
                        {% for value in range(1, 6) %}
                        <option value="{{ value }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Add new todo</button>
                <a href="{{ url_for('todo_page') }}" class="btn btn-success">Back</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
