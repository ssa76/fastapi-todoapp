[project]
name = "todoapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergey Samarkin", email = "s.samarkin@videopro.com.au" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
todoapp = "todoapp.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # pycodestyle, pyflakes, import sorting, bugbear, pyupgrade

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the installed
# `alembic` package as first-party code.
known-third-party = ["alembic"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped engine and every test share it
# (asyncpg connections can't be used from a different loop than the one that made them).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a container runtime (Docker or Podman) for Testcontainers"]
