# PostgreSQL for local labs.
#
#   podman compose -f compose.postgres.yaml up -d     # start
#   podman compose -f compose.postgres.yaml ps        # status (wait for "healthy")
#   podman compose -f compose.postgres.yaml down      # stop, keep data
#   podman compose -f compose.postgres.yaml down -v   # stop and delete data
#
# App URL (needs `uv add asyncpg`):
#   postgresql+asyncpg://todo:todo@localhost:5432/todoapp
#
# Credentials and port can be overridden in .env (see .env.example).

name: todoapp-postgres

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # localhost only
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/,
      # so the volume is mounted one level up from the old .../data path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
